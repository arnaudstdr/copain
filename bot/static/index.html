<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Copain" />
  <!-- Indique au système que la PWA supporte les deux modes ; ajuste les
       contrôles natifs (scrollbars, form inputs) en cohérence. -->
  <meta name="color-scheme" content="light dark" />
  <!-- theme-color piloté par le mode courant (status bar PWA et browser chrome). -->
  <meta name="theme-color" content="#13131a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <title>Copain</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="apple-touch-icon" href="/static/icon-1024.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Palette sombre — défaut (le rendu pré-iOS-prefers ne change pas). */
      --bg: #0f0f11;
      --bg2: #13131a;
      --bg3: #1e1e2e;
      --bg4: #26263a;
      --border: #1e1e24;
      --border2: #2a2a3a;
      --text: #e8e8ec;
      --text2: #9999aa;
      --text3: #6b6b80;
      --accent: #5b5bd6;
      --accent2: #7a7ae8;
      --green: #4ade80;
      --red: #ef4444;
      --orange: #f59e0b;
      --purple: #a855f7;
      --blue: #60a5fa;
      /* Couleurs dérivées (fond de flash, overlays, shadows) — résolues à
         partir du mode courant pour rester cohérentes entre les thèmes. */
      --flash-bg: rgba(91, 91, 214, 0.18);
      --overlay-bg: rgba(0, 0, 0, 0.55);
      --shadow-strong: 0 8px 32px rgba(0, 0, 0, 0.4);
      --track-bg: rgba(255, 255, 255, 0.1);
      --on-accent: #fff;
    }

    /* Palette claire — alignée sur le system iOS (fonds quasi-blanc, accents
       conservés). Active dès que l'iPhone est en mode clair. */
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f2f2f7;
        --bg2: #ffffff;
        --bg3: #efeff3;
        --bg4: #e5e5ea;
        --border: #e5e5ea;
        --border2: #d1d1d6;
        --text: #1c1c1e;
        --text2: #4a4a4f;
        --text3: #8e8e93;
        --accent: #5b5bd6;
        --accent2: #4c4ad6;
        --green: #34c759;
        --red: #ff3b30;
        --orange: #ff9500;
        --purple: #af52de;
        --blue: #007aff;
        --flash-bg: rgba(91, 91, 214, 0.12);
        --overlay-bg: rgba(0, 0, 0, 0.35);
        --shadow-strong: 0 8px 24px rgba(0, 0, 0, 0.12);
        --track-bg: rgba(0, 0, 0, 0.08);
        --on-accent: #fff;
      }
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }

    /* Hauteur du #app pilotée par JS via window.visualViewport (cf. setupAppHeight).
       Fallback 100dvh pour les chargements pré-JS / navigateurs sans visualViewport.
       Sur iOS 26 PWA standalone, 100dvh peut renvoyer une valeur trop petite — on
       remplace par la vraie hauteur visuelle mesurée. */
    :root { --app-h: 100dvh; }

    #app { display: flex; flex-direction: column; height: var(--app-h); max-width: 480px; margin: 0 auto; background: var(--bg); position: relative; overflow: hidden; }

    /* ── Header ── */
    header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); border-bottom: 1px solid var(--border); background: var(--bg2); flex-shrink: 0; }
    .greeting { flex: 1; min-width: 0; }
    .greeting-name { font-weight: 600; font-size: 15px; letter-spacing: -0.2px; }
    .greeting-date { font-size: 11.5px; color: var(--text3); margin-top: 1px; text-transform: capitalize; }
    .header-btn { position: relative; width: 36px; height: 36px; border-radius: 50%; background: var(--bg3); border: 1px solid var(--border2); color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform 0.1s, background 0.15s; }
    .header-btn:active { transform: scale(0.92); }
    .header-btn:hover { background: var(--bg4); }
    .badge { position: absolute; top: -3px; right: -3px; background: var(--red); color: #fff; font-size: 9px; font-weight: 700; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }

    /* ── Dashboard feed ── */
    #dashboard { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
    #dashboard::-webkit-scrollbar { width: 3px; }
    #dashboard::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; transition: background 0.2s, transform 0.15s; }
    .card.tappable { cursor: pointer; }
    .card.tappable:active { transform: scale(0.985); background: var(--bg3); }
    .card.flash { animation: flash 0.6s ease; }
    @keyframes flash { 0% { background: var(--bg2); } 30% { background: var(--flash-bg); } 100% { background: var(--bg2); } }

    .card-head { display: flex; align-items: center; gap: 10px; }
    .card-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; background: var(--bg3); flex-shrink: 0; }
    .card-label { font-size: 11.5px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
    .card-primary { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }
    .card-secondary { font-size: 13px; color: var(--text2); margin-top: 2px; }
    .card-meta { font-size: 11.5px; color: var(--text3); margin-top: 4px; }
    .card.empty .card-primary { color: var(--text3); font-weight: 400; font-style: italic; }

    .card-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    /* Enveloppes budgétaires : progress bar inline dans la card Budget. */
    .envelope-track { height: 4px; border-radius: 2px; background: var(--track-bg); margin-top: 2px; overflow: hidden; }
    .envelope-fill { height: 100%; background: var(--green); transition: width 0.2s ease; }
    .envelope-fill.overrun { background: var(--red); }
    .envelope-amount-overrun { color: var(--red); }


    /* ── Bulle de réponse éphémère ── */
    #ephemeral { position: absolute; bottom: 70px; left: 14px; right: 14px; background: var(--bg3); border: 1px solid var(--border2); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; line-height: 1.5; color: var(--text); z-index: 8; box-shadow: var(--shadow-strong); animation: slideUpFade 0.2s ease; cursor: pointer; white-space: pre-wrap; max-height: 50dvh; overflow-y: auto; }
    #ephemeral.hidden { display: none; }

    /* ── Composer wrap (preview + input bar) ── */
    /* Composer dans le flow flexbox du #app : flex-shrink: 0 la garde à sa
       taille naturelle, et comme c'est le dernier enfant après #dashboard
       (flex: 1), elle est mécaniquement collée au bas du #app. La hauteur
       du #app étant pilotée par JS via --app-h (visualViewport), le bas
       du #app = le bas physique de l'écran. */
    .composer-wrap { background: var(--bg2); flex-shrink: 0; }

    /* ── Input bar ── */
    .bar, #bar { display: flex; align-items: flex-end; gap: 7px; padding: 9px 14px; border-top: 1px solid var(--border); background: var(--bg2); flex-shrink: 0; padding-bottom: max(9px, env(safe-area-inset-bottom)); }
    .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--bg3); border: 1px solid var(--border2); color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform 0.1s, background 0.15s; }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn:hover { background: var(--bg4); }
    .icon-btn.recording { background: #3b1f4a; border-color: var(--purple); color: var(--purple); }
    /* font-size: 16px obligatoire — sinon iOS Safari déclenche un zoom auto
       sur focus de l'input et ne dézoome jamais à blur. */
    .msg-input { flex: 1; background: var(--bg3); border: 1px solid var(--border2); border-radius: 18px; padding: 8px 14px; color: var(--text); font-size: 16px; resize: none; line-height: 1.4; font-family: inherit; max-height: 110px; overflow-y: auto; outline: none; transition: border-color 0.15s; }
    .msg-input:focus { border-color: var(--accent); }
    .send-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity 0.15s, transform 0.1s; }
    .send-btn:active { transform: scale(0.92); }
    .send-btn:disabled { opacity: 0.4; cursor: default; }

    /* ── Preview photo ── */
    #preview-bar, #chat-preview-bar { padding: 8px 14px; border-top: 1px solid var(--border); background: var(--bg2); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    #preview-bar.hidden, #chat-preview-bar.hidden { display: none; }
    .preview-wrap { position: relative; width: 44px; height: 44px; flex-shrink: 0; }
    .preview-img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; }
    .remove-btn { position: absolute; top: -5px; right: -5px; width: 16px; height: 16px; border-radius: 50%; background: var(--red); border: none; color: #fff; font-size: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .preview-label { font-size: 12px; color: var(--text2); }

    /* ── Toast ── */
    #toast { position: absolute; bottom: 76px; left: 50%; transform: translateX(-50%); background: var(--bg4); border: 1px solid var(--border2); border-radius: 20px; padding: 8px 18px; font-size: 13px; color: var(--text); white-space: nowrap; z-index: 20; animation: toastIn 0.2s ease; pointer-events: none; max-width: 86%; overflow: hidden; text-overflow: ellipsis; }

    /* ── Notifications overlay ── */
    .overlay { position: absolute; inset: 0; background: var(--overlay-bg); z-index: 15; display: flex; flex-direction: column; justify-content: flex-end; animation: fadeIn 0.15s ease; }
    .overlay.hidden { display: none; }
    .panel { background: var(--bg2); border-top: 1px solid var(--border2); border-radius: 20px 20px 0 0; padding-bottom: max(20px, env(safe-area-inset-bottom)); animation: slideUp 0.25s ease; max-height: 75dvh; display: flex; flex-direction: column; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 12px; }
    .panel-title { font-weight: 600; font-size: 15px; }
    .close-btn { background: var(--bg3); border: 1px solid var(--border2); color: var(--text2); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; }
    .panel-list { overflow-y: auto; padding: 0 16px 8px; display: flex; flex-direction: column; gap: 8px; }
    .notif-item { background: var(--bg3); border: 1px solid var(--border2); border-radius: 12px; padding: 11px 13px; display: flex; flex-direction: column; gap: 4px; }
    .notif-text { font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; }
    .notif-time { font-size: 11px; color: var(--text3); align-self: flex-end; }
    .panel-empty { padding: 28px 20px; color: var(--text3); font-size: 13px; text-align: center; }

    /* ── Weather overlay ── */
    .weather-section-title { font-size: 11.5px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; margin: 8px 4px 4px; }
    .weather-hourly-strip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 4px 8px; scrollbar-width: none; flex-shrink: 0; }
    .weather-hourly-strip::-webkit-scrollbar { display: none; }
    .weather-hour { flex-shrink: 0; background: var(--bg3); border: 1px solid var(--border2); border-radius: 12px; padding: 10px 12px; min-width: 72px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .weather-hour-time { font-size: 11px; color: var(--text3); }
    .weather-hour-icon { font-size: 18px; }
    .weather-hour-temp { font-size: 14px; font-weight: 600; }
    .weather-hour-precip { font-size: 10px; color: var(--blue); }
    .weather-day { display: flex; align-items: center; gap: 12px; background: var(--bg3); border: 1px solid var(--border2); border-radius: 12px; padding: 11px 13px; flex-shrink: 0; }
    .weather-day-label { width: 64px; font-size: 13px; font-weight: 500; flex-shrink: 0; text-transform: capitalize; }
    .weather-day-icon { font-size: 18px; flex-shrink: 0; }
    .weather-day-desc { flex: 1; font-size: 12.5px; color: var(--text2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .weather-day-temps { font-size: 13px; font-weight: 500; white-space: nowrap; }
    .weather-day-precip { font-size: 11px; color: var(--blue); margin-left: 8px; white-space: nowrap; }

    /* ── Events overlay ── */
    .events-day-group { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
    .events-day-label { font-size: 11.5px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; padding: 8px 4px 2px; }
    .event-item { background: var(--bg3); border: 1px solid var(--border2); border-radius: 12px; padding: 10px 13px; display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
    .event-time { font-size: 12px; color: var(--text3); }
    .event-title { font-size: 13.5px; font-weight: 500; }
    .event-location { font-size: 11.5px; color: var(--text2); }
    .event-calendar { font-size: 10.5px; color: var(--text3); font-style: italic; align-self: flex-end; }

    /* ── Tasks overlay ── */
    .task-row { position: relative; background: var(--bg3); border: 1px solid var(--border2); border-radius: 12px; overflow: hidden; touch-action: pan-y; flex-shrink: 0; }
    .task-row-inner { display: flex; align-items: center; gap: 11px; padding: 11px 13px; background: var(--bg3); position: relative; z-index: 2; transition: transform 0.2s ease; will-change: transform; }
    .task-row.swiped .task-row-inner { transform: translateX(-84px); }
    .task-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--text3); flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s, border-color 0.15s, transform 0.1s; }
    .task-check:active { transform: scale(0.88); }
    .task-check.checked { background: var(--green); border-color: var(--green); }
    .task-check.checked svg { display: block; }
    .task-check svg { display: none; width: 14px; height: 14px; color: #0f0f11; }
    .task-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .task-content { font-size: 13.5px; line-height: 1.35; color: var(--text); word-break: break-word; }
    .task-due { font-size: 11px; color: var(--text3); }
    .task-due.overdue { color: var(--red); }
    .task-row-delete { position: absolute; top: 0; right: 0; bottom: 0; width: 84px; background: var(--red); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; cursor: pointer; z-index: 1; }
    .task-row-delete:active { opacity: 0.85; }
    .task-completing { opacity: 0.4; pointer-events: none; }

    /* ── Chat overlay (mode conversation) ── */
    .chat-feed { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
    .chat-feed::-webkit-scrollbar { width: 3px; }
    .chat-feed::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
    .row { display: flex; align-items: flex-end; gap: 8px; animation: fadeUp 0.2s ease; }
    .row.user { justify-content: flex-end; }
    .row.bot { justify-content: flex-start; }
    .avatar-sm { font-size: 14px; background: var(--bg3); border-radius: 9px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .bubble { max-width: 78%; padding: 9px 13px; border-radius: 16px; }
    .bubble.user { background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 4px; }
    .bubble.bot { background: var(--bg3); border: 1px solid var(--border2); border-bottom-left-radius: 4px; }
    .bubble-text { font-size: 14px; line-height: 1.55; white-space: pre-wrap; }
    .typing { padding: 12px 14px; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s infinite; margin-right: 4px; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    /* Chat overlay = full-app */
    #chat-view { position: absolute; inset: 0; background: var(--bg); z-index: 12; display: flex; flex-direction: column; animation: slideRight 0.2s ease; }
    #chat-view.hidden { display: none; }

    /* Markdown full-screen view (briefings, actu, …) */
    #markdown-view { position: absolute; inset: 0; background: var(--bg); z-index: 12; display: flex; flex-direction: column; animation: slideRight 0.2s ease; }
    #markdown-view.hidden { display: none; }
    .markdown-body { flex: 1; overflow-y: auto; padding: 16px 18px max(20px, env(safe-area-inset-bottom)); font-size: 14.5px; line-height: 1.6; color: var(--text); }
    .markdown-body h1 { font-size: 20px; font-weight: 700; margin: 14px 0 10px; color: var(--text); }
    .markdown-body h2 { font-size: 18px; font-weight: 700; margin: 16px 0 8px; color: var(--text); }
    .markdown-body h3 { font-size: 16px; font-weight: 600; margin: 18px 0 8px; color: var(--text); }
    .markdown-body strong { font-weight: 600; color: var(--text); }
    .markdown-body em { color: var(--text2); font-style: normal; }
    .markdown-body a { color: var(--accent2); text-decoration: none; word-break: break-all; }
    .markdown-body a:active { opacity: 0.7; }
    .markdown-body ul { list-style: none; padding: 0; margin: 8px 0; }
    .markdown-body li { padding: 8px 0 8px 18px; position: relative; border-bottom: 1px solid var(--border); }
    .markdown-body li:last-child { border-bottom: none; }
    .markdown-body li::before { content: "•"; color: var(--accent2); position: absolute; left: 4px; top: 8px; font-weight: 700; }
    .markdown-body p { margin: 6px 0; }
    .markdown-empty { color: var(--text3); text-align: center; padding: 40px 20px; font-size: 13.5px; }

    /* ── Animations ── */
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
    @keyframes slideRight { from{transform:translateX(8%);opacity:0} to{transform:translateX(0);opacity:1} }
    @keyframes slideUpFade { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    @keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(8px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
  </style>
</head>
<body>

<!-- Debug overlay temporaire : viewport sizes en temps réel. À retirer. -->
<div id="debug-panel" style="position: fixed; top: env(safe-area-inset-top, 0); right: 0; z-index: 9999; background: rgba(255, 0, 0, 0.82); color: #fff; font: 600 10px/1.35 ui-monospace, Menlo, monospace; padding: 6px 8px; border-radius: 0 0 0 8px; pointer-events: none; max-width: 200px; white-space: pre;">debug…</div>

<div id="app">

  <!-- Header -->
  <header>
    <div class="greeting">
      <div class="greeting-name" id="greeting-name">Bonjour</div>
      <div class="greeting-date" id="greeting-date">—</div>
    </div>
    <button class="header-btn" id="chat-btn" title="Ouvrir la conversation" onclick="openChat()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </button>
    <button class="header-btn" id="bell-btn" title="Notifications" onclick="openNotifs()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </button>
  </header>

  <!-- Dashboard cards -->
  <div id="dashboard"></div>

  <!-- Bulle éphémère réponse LLM -->
  <div id="ephemeral" class="hidden" onclick="hideEphemeral()"></div>

  <!-- Composer (preview photo + input bar) fixée au bas de la viewport -->
  <div class="composer-wrap" id="composer-wrap">
    <!-- Photo preview -->
    <div id="preview-bar" class="hidden">
      <div class="preview-wrap">
        <img class="preview-img" id="preview-img" src="" alt="" />
        <button class="remove-btn" onclick="removeAttachment()">✕</button>
      </div>
      <span class="preview-label">Photo jointe</span>
    </div>

    <!-- Input bar -->
    <div id="bar">
      <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFileChange(event)" />
      <button class="icon-btn" onclick="document.getElementById('file-input').click()" title="Joindre une photo">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <button class="icon-btn" id="mic-btn" onclick="toggleMic()" title="Dicter">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
          <path d="M19 10v2a7 7 0 01-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <textarea class="msg-input" id="msg-input" placeholder="Écris un mot…" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this); updateSendBtn();"></textarea>
      <button class="send-btn" id="send-btn" onclick="send()" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Notifications panel -->
  <div id="notif-overlay" class="overlay hidden" onclick="if(event.target===this)closeNotifs()">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">🔔 Notifications</span>
        <button class="close-btn" onclick="closeNotifs()">✕</button>
      </div>
      <div class="panel-list" id="notif-list">
        <div class="panel-empty">Chargement…</div>
      </div>
    </div>
  </div>

  <!-- Tasks panel -->
  <div id="tasks-overlay" class="overlay hidden" onclick="if(event.target===this)closeTasks()">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">✅ Tâches en cours</span>
        <button class="close-btn" onclick="closeTasks()">✕</button>
      </div>
      <div class="panel-list" id="tasks-list">
        <div class="panel-empty">Chargement…</div>
      </div>
    </div>
  </div>

  <!-- Weather panel -->
  <div id="weather-overlay" class="overlay hidden" onclick="if(event.target===this)closeWeather()">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title" id="weather-title">🌤 Météo</span>
        <button class="close-btn" onclick="closeWeather()">✕</button>
      </div>
      <div class="panel-list" id="weather-list">
        <div class="panel-empty">Chargement…</div>
      </div>
    </div>
  </div>

  <!-- Events panel -->
  <div id="events-overlay" class="overlay hidden" onclick="if(event.target===this)closeEvents()">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">📅 Évènements à venir</span>
        <button class="close-btn" onclick="closeEvents()">✕</button>
      </div>
      <div class="panel-list" id="events-list">
        <div class="panel-empty">Chargement…</div>
      </div>
    </div>
  </div>

  <!-- Markdown full-screen view (réutilisé pour la card Actu) -->
  <div id="markdown-view" class="hidden">
    <header>
      <button class="header-btn" onclick="closeMarkdownView()" title="Retour">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <div class="greeting" style="margin-left:8px">
        <div class="greeting-name" id="markdown-title">—</div>
        <div class="greeting-date" id="markdown-subtitle">—</div>
      </div>
    </header>
    <div class="markdown-body" id="markdown-body"></div>
  </div>

  <!-- Chat overlay (mode conversation) -->
  <div id="chat-view" class="hidden">
    <header>
      <button class="header-btn" onclick="closeChat()" title="Retour">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <div class="greeting" style="margin-left:8px">
        <div class="greeting-name">Conversation</div>
        <div class="greeting-date">Mode dialogue</div>
      </div>
    </header>
    <div class="chat-feed" id="chat-feed"></div>

    <!-- Composer du chat (preview + input) fixée au bas, z-index plus élevé
         que la composer du dashboard pour la couvrir quand chat-view est visible. -->
    <div class="composer-wrap chat">
      <div id="chat-preview-bar" class="hidden">
        <div class="preview-wrap">
          <img class="preview-img" id="chat-preview-img" src="" alt="" />
          <button class="remove-btn" onclick="removeChatAttachment()">✕</button>
        </div>
        <span class="preview-label">Photo jointe</span>
      </div>

      <div class="bar" id="chat-bar">
        <input type="file" id="chat-file-input" accept="image/*" style="display:none" onchange="handleChatFileChange(event)" />
        <button class="icon-btn" onclick="document.getElementById('chat-file-input').click()" title="Joindre une photo">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <button class="icon-btn" id="chat-mic-btn" onclick="toggleChatMic()" title="Dicter">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
            <path d="M19 10v2a7 7 0 01-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <textarea class="msg-input" id="chat-input" placeholder="Écris…" rows="1" onkeydown="handleChatKey(event)" oninput="autoResize(this); updateChatSendBtn();"></textarea>
        <button class="send-btn" id="chat-send-btn" onclick="chatSend()" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

</div>

<script>
  // ── Config ────────────────────────────────────────────────────────────────
  let API_KEY = "";
  const API_BASE = "";
  const PROFILE_NAME = "Arnaud";

  // ── État ──────────────────────────────────────────────────────────────────
  let loading      = false;
  let attachment   = null;   // { b64, mediaType, preview }
  let recognition  = null;
  let toastTimer   = null;
  let ephemeralTimer = null;
  let dashboardData = null;
  let chatHistory  = [];     // [{role, text}]
  // Card Actu : état persistant en mémoire (la card reste « fraîche » tant
  // que la PWA est ouverte ; un reload de la page remet à zéro).
  let newsState   = { fetchedAt: null, loading: false, markdown: null };

  // ── Init ──────────────────────────────────────────────────────────────────
  document.addEventListener("DOMContentLoaded", async () => {
    setupAppHeight();
    renderGreeting();
    try {
      const cfg = await fetch("/config").then(r => r.json());
      API_KEY = cfg.api_key;
    } catch (e) {
      // /config est sur le même réseau Tailscale ; un échec ici est critique.
      showToast("Configuration indisponible");
    }
    await loadDashboard();
    // Refresh périodique léger pour le count notif et la météo (toutes les 2 min).
    setInterval(loadDashboard, 120_000);
  });

  // Pilote --app-h depuis window.visualViewport.height (fallback innerHeight).
  // Sur iOS 26 PWA standalone, 100dvh peut renvoyer une valeur qui ne reflète
  // pas la viewport visuelle réelle, ce qui laissait apparaître une bande
  // vide sous la composer bar. visualViewport remonte la vraie hauteur
  // utilisable (et s'ajuste quand le clavier s'ouvre/se ferme).
  function setupAppHeight() {
    const update = () => {
      const h = window.visualViewport?.height || window.innerHeight;
      document.documentElement.style.setProperty("--app-h", `${h}px`);
      refreshDebugPanel();
    };
    update();
    window.addEventListener("resize", update);
    window.addEventListener("orientationchange", update);
    window.visualViewport?.addEventListener("resize", update);
    // Live refresh aussi : on regarde toutes les 500ms pour attraper les
    // changements qui ne déclenchent pas les events ci-dessus.
    setInterval(refreshDebugPanel, 500);
  }

  // Debug overlay : affiche les viewport sizes en temps réel pour comprendre
  // ce qui ment sur iOS 26 PWA standalone. À retirer une fois le problème
  // identifié.
  function refreshDebugPanel() {
    const panel = document.getElementById("debug-panel");
    if (!panel) return;
    const app = document.getElementById("app");
    const appRect = app ? app.getBoundingClientRect() : { height: 0 };
    const cssH = getComputedStyle(document.documentElement)
      .getPropertyValue("--app-h").trim();
    const lines = [
      `innerH       ${window.innerHeight}`,
      `vvH          ${window.visualViewport?.height ?? "n/a"}`,
      `docH         ${document.documentElement.clientHeight}`,
      `screenH      ${window.screen.height}`,
      `app.height   ${Math.round(appRect.height)}`,
      `app.bottom   ${Math.round(appRect.bottom)}`,
      `--app-h      ${cssH}`,
      `dpr          ${window.devicePixelRatio}`,
      `standalone   ${window.navigator.standalone}`,
    ];
    panel.textContent = lines.join("\n");
  }

  function renderGreeting() {
    document.getElementById("greeting-name").textContent = `Bonjour ${PROFILE_NAME}`;
    const d = new Date();
    const opts = { weekday: "long", day: "numeric", month: "long" };
    document.getElementById("greeting-date").textContent = d.toLocaleDateString("fr-FR", opts);
  }

  // ── Dashboard ─────────────────────────────────────────────────────────────
  async function loadDashboard() {
    try {
      const res = await fetch(`${API_BASE}/dashboard`, { headers: { "X-API-Key": API_KEY } });
      if (!res.ok) throw new Error(`${res.status}`);
      dashboardData = await res.json();
      renderDashboard(dashboardData);
      renderBellBadge(dashboardData.unread_notifications);
    } catch (e) {
      renderDashboardError();
    }
  }

  function renderDashboard(d) {
    const root = document.getElementById("dashboard");
    root.innerHTML = "";

    // Météo
    root.appendChild(weatherCard(d.weather));
    // Prochain évent
    root.appendChild(eventCard(d.next_event));
    // Tâches
    root.appendChild(tasksCard(d.today_tasks));
    // Budget (restant ce mois)
    root.appendChild(budgetCard(d.budget));
    // Notifs (count)
    root.appendChild(notifCard(d.unread_notifications));
    // Actu (vraie card avec fetch au clic)
    root.appendChild(newsCard());
  }

  function renderDashboardError() {
    const root = document.getElementById("dashboard");
    root.innerHTML = `
      <div class="card empty">
        <div class="card-primary">Dashboard indisponible</div>
        <div class="card-secondary">Vérifie que le Pi est accessible via Tailscale, puis tire pour rafraîchir.</div>
      </div>`;
  }

  function weatherCard(w) {
    const card = el("div", "card");
    if (!w) {
      card.classList.add("empty");
      card.appendChild(makeHead("🌤", "Météo"));
      card.appendChild(el("div", "card-primary", "Indisponible"));
      return card;
    }
    card.classList.add("tappable");
    card.onclick = openWeather;
    card.appendChild(makeHead("🌤", "Météo · " + w.city));
    const tempLine = `${Math.round(w.temp_current)}° · ${w.description}`;
    card.appendChild(el("div", "card-primary", tempLine));
    const detail = `min ${Math.round(w.temp_min)}° / max ${Math.round(w.temp_max)}°`
      + (w.precipitation_mm > 0 ? ` · ${w.precipitation_mm.toFixed(1)} mm` : "");
    card.appendChild(el("div", "card-secondary", detail));
    return card;
  }

  function eventCard(e) {
    const card = el("div", "card");
    if (!e) {
      card.classList.add("empty");
      card.appendChild(makeHead("📅", "Prochain évènement"));
      card.appendChild(el("div", "card-primary", "Rien à venir"));
      card.classList.add("tappable");
      card.onclick = openEvents;
      return card;
    }
    card.classList.add("tappable");
    card.onclick = openEvents;
    card.appendChild(makeHead("📅", "Prochain évènement · " + e.calendar_name));
    const start = new Date(e.start);
    const dayLabel = sameDay(start, new Date())
      ? `Aujourd'hui ${formatHM(start)}`
      : `${formatRelativeDay(start)} ${formatHM(start)}`;
    card.appendChild(el("div", "card-primary", `${dayLabel} — ${e.title}`));
    if (e.location) card.appendChild(el("div", "card-secondary", e.location));
    return card;
  }

  function tasksCard(tasks) {
    const card = el("div", "card tappable");
    card.onclick = openTasks;
    if (!tasks || tasks.length === 0) {
      card.classList.add("empty");
      card.appendChild(makeHead("✅", "Tâches du jour"));
      card.appendChild(el("div", "card-primary", "Aucune tâche aujourd'hui"));
      const sub = el("div", "card-secondary", "Tape pour voir toutes les tâches");
      card.appendChild(sub);
      return card;
    }
    const label = tasks.length === 1 ? "1 tâche aujourd'hui" : `${tasks.length} tâches aujourd'hui`;
    card.appendChild(makeHead("✅", label));
    // Première tâche en focus
    const t = tasks[0];
    const suffix = t.due_at ? ` · ${formatHM(new Date(t.due_at))}` : "";
    card.appendChild(el("div", "card-primary", t.content + suffix));
    if (tasks.length > 1) {
      card.appendChild(el("div", "card-meta", `+ ${tasks.length - 1} autre${tasks.length > 2 ? "s" : ""}`));
    } else {
      card.appendChild(el("div", "card-meta", "Tape pour gérer"));
    }
    return card;
  }

  function budgetCard(b) {
    const card = el("div", "card");
    card.appendChild(makeHead("💰", "Budget"));
    if (!b) {
      card.classList.add("empty");
      card.appendChild(el("div", "card-primary", "Non configuré"));
      card.appendChild(el("div", "card-secondary", "Ajoute la section `finances` dans data/profile.yaml"));
      return card;
    }
    card.classList.add("tappable");
    card.onclick = openBudget;
    const remaining = formatEur(b.remaining_eur);
    const primary = el("div", "card-primary", `Restant : ${remaining}`);
    if (b.remaining_eur < 0) primary.style.color = "var(--red)";
    card.appendChild(primary);
    const savedLine = `Épargné cette année : ${formatEur(b.saved_this_year_eur)}`;
    card.appendChild(el("div", "card-secondary", savedLine));
    if (b.pending_recurring_count > 0) {
      const meta = el(
        "div",
        "card-meta",
        b.pending_recurring_count === 1
          ? "1 récurrente à pointer"
          : `${b.pending_recurring_count} récurrentes à pointer`
      );
      if (b.has_overdue) meta.style.color = "var(--red)";
      card.appendChild(meta);
    }
    if (b.envelopes && b.envelopes.length > 0) {
      const wrap = el("div", "budget-envelopes");
      wrap.style.marginTop = "8px";
      for (const env of b.envelopes) {
        wrap.appendChild(envelopeRow(env));
      }
      card.appendChild(wrap);
    }
    return card;
  }

  function envelopeRow(env) {
    const row = el("div", "envelope-row");
    row.style.fontSize = "0.85em";
    row.style.marginTop = "4px";

    const top = el("div", "envelope-line");
    top.style.display = "flex";
    top.style.justifyContent = "space-between";
    const label = el("span", "envelope-label", env.label);
    const amounts = el(
      "span",
      "envelope-amounts",
      `${formatEur(env.spent_eur)} / ${formatEur(env.allocated_eur)}`
    );
    if (env.is_overrun) amounts.classList.add("envelope-amount-overrun");
    top.appendChild(label);
    top.appendChild(amounts);
    row.appendChild(top);

    // Progress bar : bg gris (var --track-bg, adapté light/dark), fill jusqu'au
    // % consommé (capé à 100). En cas de dépassement, on remplit à 100% en rouge.
    const ratio = env.allocated_eur > 0
      ? Math.min(1, env.spent_eur / env.allocated_eur)
      : 0;
    const track = el("div", "envelope-track");
    const fill = el("div", "envelope-fill" + (env.is_overrun ? " overrun" : ""));
    fill.style.width = `${ratio * 100}%`;
    track.appendChild(fill);
    row.appendChild(track);
    return row;
  }

  function formatEur(amount) {
    const rounded = Math.round(amount * 100) / 100;
    if (Number.isInteger(rounded)) return `${rounded} €`;
    return `${rounded.toFixed(2).replace(".", ",")} €`;
  }

  async function openBudget() {
    try {
      const res = await fetch(`${API_BASE}/budget`, { headers: { "X-API-Key": API_KEY } });
      if (!res.ok) throw new Error(`${res.status}`);
      const data = await res.json();
      openMarkdownView("Budget du mois", renderBudgetMarkdown(data), null);
    } catch (e) {
      showToast("Impossible de charger le budget");
    }
  }

  function renderBudgetMarkdown(b) {
    const lines = [];
    const monthDate = new Date(b.month + "T00:00:00");
    const monthLabel = monthDate.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
    lines.push(`## ${monthLabel.charAt(0).toUpperCase() + monthLabel.slice(1)}`);
    lines.push("");
    lines.push(`**Restant prévisionnel : ${formatEur(b.remaining_eur)}**`);
    lines.push("");
    lines.push(`- Revenu : ${formatEur(b.income_eur)}`);
    lines.push(`- Récurrentes pointées : ${formatEur(b.spent_recurring_eur)}`);
    lines.push(`- Ponctuelles : ${formatEur(b.spent_punctual_eur)}`);
    lines.push(`- Épargne ce mois : ${formatEur(b.saved_this_month_eur)}`);
    lines.push(`- Épargné cette année : ${formatEur(b.saved_this_year_eur)}`);
    lines.push("");
    if (b.envelopes && b.envelopes.length > 0) {
      lines.push("### Enveloppes");
      for (const env of b.envelopes) {
        const overrun = env.is_overrun
          ? ` ⚠ dépassement de ${formatEur(env.overrun_eur)}`
          : "";
        lines.push(
          `- **${env.label}** : ${formatEur(env.spent_eur)} / ${formatEur(env.allocated_eur)}${overrun}`
        );
      }
      lines.push("");
    }
    if (b.pending && b.pending.length > 0) {
      lines.push(`### À pointer (${b.pending.length})`);
      for (const p of b.pending) {
        const overdue = p.is_overdue ? " ⚠ en retard" : "";
        const kind = p.kind === "saving" ? " (épargne)" : "";
        lines.push(`- **${p.label}** ${formatEur(p.amount_eur)}, prévu le ${p.day}${kind}${overdue}`);
      }
      lines.push("");
    }
    if (b.transactions && b.transactions.length > 0) {
      lines.push("### Transactions du mois");
      for (const t of b.transactions) {
        const d = new Date(t.occurred_on + "T00:00:00");
        const dayStr = d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
        const sign = t.kind === "income" ? "+" : "−";
        const cat = t.category ? ` (${t.category})` : "";
        lines.push(`- ${dayStr} — ${t.label}${cat} : ${sign}${formatEur(t.amount_eur)}`);
      }
    } else {
      lines.push("_Aucune transaction enregistrée ce mois._");
    }
    return lines.join("\n");
  }

  function notifCard(count) {
    const card = el("div", "card tappable");
    card.onclick = openNotifs;
    card.appendChild(makeHead("🔔", "Notifications"));
    if (count === 0) {
      card.classList.add("empty");
      card.appendChild(el("div", "card-primary", "Aucune notif non lue"));
    } else {
      card.appendChild(el("div", "card-primary", count === 1 ? "1 notif non lue" : `${count} notifs non lues`));
      card.appendChild(el("div", "card-secondary", "Tape pour les consulter"));
    }
    return card;
  }

  function newsCard() {
    const card = el("div", "card tappable");
    card.onclick = openNews;
    card.appendChild(makeHead("📰", "Actu"));
    if (newsState.loading) {
      card.appendChild(el("div", "card-primary", "Chargement…"));
      card.appendChild(el("div", "card-meta", "Curation des dernières 24h"));
      return card;
    }
    if (newsState.markdown) {
      card.appendChild(el("div", "card-primary", "Tape pour relire"));
      const ago = newsState.fetchedAt ? formatRelativeAge(newsState.fetchedAt) : "";
      card.appendChild(el("div", "card-meta", ago ? `Mis à jour ${ago}` : ""));
      return card;
    }
    card.classList.add("empty");
    card.appendChild(el("div", "card-primary", "Tape pour les dernières actus"));
    card.appendChild(el("div", "card-meta", "Curation IA des 24h"));
    return card;
  }

  async function openNews() {
    // Si on a déjà un fetch en mémoire, on rouvre l'overlay sans refetch.
    if (newsState.markdown && !newsState.loading) {
      openMarkdownView("Actu du jour", newsState.markdown, newsState.fetchedAt);
      return;
    }
    if (newsState.loading) return;

    newsState.loading = true;
    if (dashboardData) renderDashboard(dashboardData);

    try {
      const res = await fetch(`${API_BASE}/news/latest`, {
        headers: { "X-API-Key": API_KEY }
      });
      if (!res.ok) throw new Error(`${res.status}`);
      const data = await res.json();
      newsState.markdown = data.markdown || "";
      newsState.fetchedAt = data.fetched_at;
      newsState.loading = false;
      if (dashboardData) renderDashboard(dashboardData);
      openMarkdownView("Actu du jour", newsState.markdown, newsState.fetchedAt);
    } catch (e) {
      newsState.loading = false;
      if (dashboardData) renderDashboard(dashboardData);
      showToast("Impossible de charger les actus");
    }
  }

  function formatRelativeAge(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    const ageMin = Math.max(0, Math.floor((Date.now() - d.getTime()) / 60_000));
    if (ageMin < 1) return "à l'instant";
    if (ageMin < 60) return `il y a ${ageMin} min`;
    const ageH = Math.floor(ageMin / 60);
    if (ageH < 24) return `il y a ${ageH} h`;
    return `il y a ${Math.floor(ageH / 24)} j`;
  }

  function renderBellBadge(count) {
    const btn = document.getElementById("bell-btn");
    btn.querySelector(".badge")?.remove();
    if (count > 0) {
      const badge = el("span", "badge", count > 9 ? "9+" : String(count));
      btn.appendChild(badge);
    }
  }

  // ── Envoi /ask ────────────────────────────────────────────────────────────
  async function triggerAsk(prefill) {
    document.getElementById("msg-input").value = prefill;
    updateSendBtn();
    await send();
  }

  async function send() {
    const text = document.getElementById("msg-input").value.trim();
    if ((!text && !attachment) || loading) return;

    setLoading(true);
    const att = attachment;
    removeAttachment();
    document.getElementById("msg-input").value = "";
    autoResize(document.getElementById("msg-input"));
    updateSendBtn();

    try {
      const body = att
        ? await callImage(text, att)
        : await callText(text);
      handleAskResponse(body, text);
    } catch (e) {
      showEphemeral("⚠️ Impossible de joindre Copain. Vérifie Tailscale.", true);
    } finally {
      setLoading(false);
    }
  }

  function handleAskResponse(body, userText) {
    const intent = body.intent || "answer";
    const refresh = body.refresh_cards || [];

    // Mode action : toast court + rafraîchissement des cards concernées
    if (refresh.length > 0) {
      showToast(actionToast(intent));
      loadDashboard().then(() => flashCards(refresh));
    } else {
      // Mode question : on affiche la réponse texte en éphémère
      showEphemeral(body.response, false);
    }
  }

  function actionToast(intent) {
    switch (intent) {
      case "task":   return "✓ Tâche ajoutée";
      case "event":  return "✓ Évènement créé";
      case "feed":   return "✓ Flux mis à jour";
      case "memory": return "✓ Noté en mémoire";
      case "expense":return "✓ Saisie enregistrée";
      default:       return "✓ Fait";
    }
  }

  function flashCards(names) {
    // On flash visuellement les cards concernées pour que l'œil les repère.
    document.querySelectorAll("#dashboard .card").forEach(c => c.classList.remove("flash"));
    // Pas de mapping précis name→DOM (le dashboard est rendu fraîchement) ;
    // on flash juste TOUTES les cards une fois pour signaler le rafraîchissement.
    // Une version v2 ferait un mapping par data-attr si besoin.
    setTimeout(() => {
      document.querySelectorAll("#dashboard .card").forEach((c, i) => {
        if (names.length > 0 && i < 3) c.classList.add("flash");
      });
    }, 30);

  // ── Mic (Web Speech API) ──────────────────────────────────────────────────
  function toggleMic() { _toggleMic("mic-btn", "msg-input", updateSendBtn); }
  function toggleChatMic() { _toggleMic("chat-mic-btn", "chat-input", updateChatSendBtn); }
  function _toggleMic(btnId, inputId, updateBtn) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { showToast("Micro non supporté ici (HTTPS requis)"); return; }
    if (recognition) {
      recognition.stop(); recognition = null;
      document.getElementById(btnId).classList.remove("recording");
      return;
    }
    const r = new SR();
    r.lang = "fr-FR"; r.continuous = false; r.interimResults = false;
    recognition = r;
    document.getElementById(btnId).classList.add("recording");
    r.onresult = e => {
      const t = e.results[0][0].transcript;
      const input = document.getElementById(inputId);
      input.value = input.value ? `${input.value} ${t}` : t;
      autoResize(input); updateBtn();
    };
    r.onerror = () => { showToast("Erreur micro"); };
    r.onend = () => { recognition = null; document.getElementById(btnId).classList.remove("recording"); };
    r.start();
  }

  /**
   * Mini-parseur markdown utilisé par la card Actu (et plus largement
   * tout texte enrichi côté backend).
   *
   * Couvre :
   *  - `**gras**`            → <strong>
   *  - `*italique*`          → <em>
   *  - URL nue               → <a href>
   *  - lignes commençant par `- ` → groupées dans une <ul>
   *  - lignes commençant par un emoji + `*titre*` → <h3>
   *  - autres lignes non vides → <p>
   *
   * On échappe le HTML avant traitement pour éviter toute injection
   * via le contenu (URLs externes, titres d'articles, etc.).
   */
  function renderMarkdown(text) {
    const esc = escHtml(text);
    const lines = esc.split("\n");
    const out = [];
    let listBuffer = [];

    const flushList = () => {
      if (listBuffer.length === 0) return;
      out.push("<ul>" + listBuffer.map(l => `<li>${l}</li>`).join("") + "</ul>");
      listBuffer = [];
    };

    for (const raw of lines) {
      const line = inlineMd(raw);
      const stripped = raw.trim();
      if (!stripped) { flushList(); continue; }

      // Titres ATX : "# ", "## ", "### "
      const h = stripped.match(/^(#{1,3})\s+(.+)$/);
      if (h) {
        flushList();
        const level = h[1].length;
        out.push(`<h${level}>${inlineMd(h[2])}</h${level}>`);
        continue;
      }

      // Titres de section : "📰 *Actus du jour*" ou "🤖 *Actus IA …*"
      if (/^(📰|🤖|☀️|📅|✅|📋|🌤|🌧)/.test(stripped) && /\*[^*]+\*/.test(stripped)) {
        flushList();
        out.push(`<h3>${inlineMd(raw)}</h3>`);
        continue;
      }

      // Item de liste : commence par "- "
      if (stripped.startsWith("- ")) {
        listBuffer.push(inlineMd(raw.replace(/^\s*-\s+/, "")));
        continue;
      }

      // Ligne d'indentation (continuation d'un item, ex: URL sur ligne suivante)
      if (/^\s{2,}/.test(raw) && listBuffer.length > 0) {
        listBuffer[listBuffer.length - 1] += `<br>${inlineMd(raw.trim())}`;
        continue;
      }

      flushList();
      out.push(`<p>${line}</p>`);
    }
    flushList();
    return out.join("");
  }

  function inlineMd(s) {
    return s
      // **gras** (greedy minimal)
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      // *italique* (sans capturer **)
      .replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, "<em>$1</em>")
      // URLs nues → liens (target=_blank pour ouvrir hors PWA)
      .replace(
        /(https?:\/\/[^\s<>"'()]+)/g,
        '<a href="$1" target="_blank" rel="noopener">$1</a>'
      );
  }

  function renderTasks(tasks) {
    const list = document.getElementById("tasks-list");
    list.innerHTML = "";
    if (tasks.length === 0) {

  function makeTaskRow(t) {
    const row = el("div", "task-row");
    row.dataset.taskId = String(t.id);

    // Bouton "Supprimer" révélé par swipe gauche.
    const del = el("div", "task-row-delete", "Supprimer");
    del.onclick = (e) => { e.stopPropagation(); deleteTask(t.id, row); };
    row.appendChild(del);

    // Contenu principal de la ligne (cliquable, swipable).
    const inner = el("div", "task-row-inner");

    const check = el("div", "task-check");
    check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>';
    check.onclick = (e) => { e.stopPropagation(); completeTask(t.id, row, check); };
    inner.appendChild(check);

    const body = el("div", "task-body");
    body.appendChild(el("div", "task-content", t.content));
    if (t.due_at) {
      const due = new Date(t.due_at);
      const isOverdue = due < new Date();
      const dueEl = el("div", "task-due" + (isOverdue ? " overdue" : ""), formatTaskDue(due));
      body.appendChild(dueEl);
    }
    inner.appendChild(body);

    // Tap court sur la ligne (en dehors de la checkbox) replie le swipe si ouvert.
    inner.onclick = () => { row.classList.remove("swiped"); };

    row.appendChild(inner);
    attachSwipe(row, inner);
    return row;
  }

  function attachSwipe(row, inner) {
    let startX = 0;
    let currentX = 0;
    let dragging = false;
    let opened = false;

    const onStart = (e) => {
      const t = e.touches ? e.touches[0] : e;
      startX = t.clientX;
      currentX = startX;
      dragging = true;
      inner.style.transition = "none";
    };
    const onMove = (e) => {
      if (!dragging) return;
      const t = e.touches ? e.touches[0] : e;
      currentX = t.clientX;
      const dx = Math.min(0, currentX - startX); // n'autorise que swipe gauche
      const offset = opened ? -84 + dx : dx;
      inner.style.transform = `translateX(${Math.max(-84, offset)}px)`;
    };
    const onEnd = () => {
      if (!dragging) return;
      dragging = false;
      inner.style.transition = "";
      inner.style.transform = "";
      const dx = currentX - startX;
      // Seuil 40px : si swipe gauche dépasse, on ouvre. Si swipe droit suffit, on referme.
      if (!opened && dx < -40) {
        row.classList.add("swiped");
        opened = true;
      } else if (opened && dx > 30) {
        row.classList.remove("swiped");
        opened = false;
      } else {
        // Snap back à l'état précédent.
        if (opened) row.classList.add("swiped"); else row.classList.remove("swiped");
      }
    };

    inner.addEventListener("touchstart", onStart, { passive: true });
    inner.addEventListener("touchmove", onMove, { passive: true });
    inner.addEventListener("touchend", onEnd);
    // Support souris pour le desktop / test.
    inner.addEventListener("mousedown", onStart);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onEnd);
  }

  async function completeTask(id, row, check) {
    if (row.classList.contains("task-completing")) return;
    row.classList.add("task-completing");
    check.classList.add("checked");
    try {
      const res = await fetch(`${API_BASE}/tasks/${id}/complete`, {
        method: "POST",
        headers: { "X-API-Key": API_KEY }
      });
      if (!res.ok) throw new Error(`${res.status}`);
      // Animation de disparition puis retrait du DOM.
      setTimeout(() => {
        row.style.transition = "opacity 0.25s, max-height 0.25s, padding 0.25s, margin 0.25s";
        row.style.opacity = "0";
        row.style.maxHeight = "0";
        row.style.padding = "0";
        row.style.margin = "0";
        setTimeout(() => row.remove(), 260);
      }, 200);
    } catch (e) {
      row.classList.remove("task-completing");
      check.classList.remove("checked");
      showToast("Impossible de cocher");
    }
  }

  async function deleteTask(id, row) {
    try {
      const res = await fetch(`${API_BASE}/tasks/${id}`, {
        method: "DELETE",
        headers: { "X-API-Key": API_KEY }
      });
      if (!res.ok) throw new Error(`${res.status}`);
      row.style.transition = "opacity 0.2s, max-height 0.2s, padding 0.2s, margin 0.2s";
      row.style.opacity = "0";
      row.style.maxHeight = "0";
      row.style.padding = "0";
      row.style.margin = "0";
      setTimeout(() => row.remove(), 210);
    } catch (e) {
      showToast("Impossible de supprimer");
    }
  }

  function formatTaskDue(d) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const dayDiff = Math.floor((d.getTime() - today.getTime()) / (24 * 3600 * 1000));
    const hm = d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    if (dayDiff < 0) {
      const ago = Math.abs(dayDiff);
      return `En retard de ${ago} jour${ago > 1 ? "s" : ""}`;
    }
    if (dayDiff === 0) return `Aujourd'hui ${hm}`;
    if (dayDiff === 1) return `Demain ${hm}`;
    return d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }) + ` ${hm}`;
  }

  function makeChatRow(role, text, imgSrc) {
    const row = el("div", `row ${role === "user" ? "user" : "bot"}`);

    const bubble = el("div", `bubble ${role === "user" ? "user" : "bot"}`);
    if (imgSrc) {
      const img = document.createElement("img");
      img.src = imgSrc;
      img.className = "bubble-img";
      img.alt = "photo";
      bubble.appendChild(img);
    }
    if (text) {
      bubble.appendChild(el("span", "bubble-text", text));
    }
    row.appendChild(bubble);
    return row;
  }

  // Pièce jointe spécifique au mode chat (séparée de `attachment` utilisée
  // par la barre principale, pour que les deux vues ne s'écrasent pas).
  let chatAttachment = null;

  function handleChatFileChange(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      chatAttachment = { b64: result.split(",")[1], mediaType: file.type, preview: result };
      document.getElementById("chat-preview-img").src = result;
      document.getElementById("chat-preview-bar").classList.remove("hidden");
      document.getElementById("chat-input").placeholder = "Ajoute un mot…";
      updateChatSendBtn();
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  }

  function removeChatAttachment() {
    chatAttachment = null;
    document.getElementById("chat-preview-bar").classList.add("hidden");
    document.getElementById("chat-preview-img").src = "";
    document.getElementById("chat-input").placeholder = "Écris…";
    updateChatSendBtn();
  }

  async function chatSend() {
    const input = document.getElementById("chat-input");
    const text = input.value.trim();
    if ((!text && !chatAttachment) || loading) return;
    setLoading(true, "chat");

    // Snapshot la pièce jointe avant de reset, pour pouvoir l'afficher
    // dans la bulle utilisateur et la transmettre à callImage.
    const att = chatAttachment;
    chatHistory.push({ role: "user", text, imgSrc: att?.preview ?? null });
    removeChatAttachment();
    renderChatFeed();
    input.value = ""; autoResize(input); updateChatSendBtn();

    // Indicateur "en train d'écrire"
    const feed = document.getElementById("chat-feed");
    const typing = el("div", "row bot typing-row");
    typing.id = "chat-typing";
    typing.appendChild(el("div", "avatar-sm", "🤝"));
    const tb = el("div", "bubble bot typing");
    tb.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    typing.appendChild(tb); feed.appendChild(typing); feed.scrollTop = feed.scrollHeight;

    try {
      const body = att ? await callImage(text, att) : await callText(text);
      chatHistory.push({ role: "assistant", text: body.response });
      // On rafraîchit le dashboard en arrière-plan si l'action a modifié quelque chose.
      if (body.refresh_cards && body.refresh_cards.length > 0) loadDashboard();
    } catch (e) {
      chatHistory.push({ role: "assistant", text: "⚠️ Impossible de joindre Copain." });
    } finally {
      setLoading(false, "chat");
      document.getElementById("chat-typing")?.remove();
      renderChatFeed();
    }
  }

  // ── UI helpers ────────────────────────────────────────────────────────────
  function escHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function makeHead(icon, label) {
    const head = el("div", "card-head");
    head.appendChild(el("div", "card-icon", icon));
    head.appendChild(el("div", "card-label", label));
    return head;
  }
  function setLoading(val, scope) {
    loading = val;
    if (scope === "chat") {
      document.getElementById("chat-send-btn").disabled = val || !canChatSend();
    } else {
      document.getElementById("send-btn").disabled = val || !canSend();
    }
  }
  function canSend() {
    return (document.getElementById("msg-input").value.trim() || !!attachment) && !loading;
  }
  function canChatSend() {
    return (document.getElementById("chat-input").value.trim() || !!chatAttachment) && !loading;
  }
  function updateSendBtn() { document.getElementById("send-btn").disabled = !canSend(); }
  function updateChatSendBtn() { document.getElementById("chat-send-btn").disabled = !canChatSend(); }
  function handleKey(e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }
  function handleChatKey(e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); chatSend(); } }
  function autoResize(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 110) + "px";
  }

  // ── Date helpers ──────────────────────────────────────────────────────────
  function sameDay(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }
  function formatHM(d) {
    return d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  }
  function formatRelativeDay(d) {
    const today = new Date();
    const tomorrow = new Date(today);
    tomorrow.setDate(today.getDate() + 1);
    if (sameDay(d, tomorrow)) return "Demain";
    return d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" });
  }
  function formatDateTime(d) {
    return d.toLocaleString("fr-FR", { weekday: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  }
</script>
</body>
</html>
