<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Copain" />
  <!-- Indique au système que la PWA supporte les deux modes ; ajuste les
       contrôles natifs (scrollbars, form inputs) en cohérence. -->
  <meta name="color-scheme" content="light dark" />
  <!-- theme-color : conservé pour la rétro-compatibilité (anciens Safari,
       Android). Safari/WebKit 26 l'IGNORE : il peint les zones système en
       échantillonnant les éléments position:fixed au bord du viewport
       (cf. #edge-glass en bas de page + layout.css). -->
  <meta name="theme-color" content="#15181c" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#e9edf1" media="(prefers-color-scheme: light)" />
  <title>Copain</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="apple-touch-icon" href="/static/icon-1024.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles/theme.css?v=5" />
  <link rel="stylesheet" href="/static/styles/layout.css?v=13" />
  <link rel="stylesheet" href="/static/styles/components.css?v=12" />
  <link rel="stylesheet" href="/static/styles/animations.css?v=4" />
</head>
<body>
<div id="app">

  <!-- Header -->
  <header>
    <div class="greeting">
      <div class="greeting-name" id="greeting-name">Bonjour</div>
      <div class="greeting-date" id="greeting-date">—</div>
    </div>
    <button class="header-btn" id="chat-btn" title="Ouvrir la conversation">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </button>
    <button class="header-btn" id="bell-btn" title="Notifications">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </button>
  </header>

  <!-- Dashboard cards -->
  <div id="dashboard"></div>

  <!-- Bulle éphémère réponse LLM -->
  <div id="ephemeral" class="hidden"></div>

  <!-- Composer (preview photo + input bar) fixée au bas de la viewport -->
  <div class="composer-wrap" id="composer-wrap">
    <!-- Photo preview -->
    <div id="preview-bar" class="hidden">
      <div class="preview-wrap">
        <img class="preview-img" id="preview-img" src="" alt="" />
        <button class="remove-btn" aria-label="Retirer la photo">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <span class="preview-label">Photo jointe</span>
    </div>

    <!-- Input bar -->
    <div id="bar">
      <input type="file" id="file-input" accept="image/*" style="display:none" />
      <button class="icon-btn" title="Joindre une photo">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <button class="icon-btn" id="mic-btn" title="Dicter">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
          <path d="M19 10v2a7 7 0 01-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <textarea class="msg-input" id="msg-input" placeholder="Écris un mot…" rows="1"></textarea>
      <button class="send-btn" id="send-btn" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Notifications panel -->
  <div id="notif-overlay" class="overlay hidden">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title"><svg class="lucide lucide-bell lucide-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>Notifications</span>
        <button class="close-btn" aria-label="Fermer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="panel-list" id="notif-list">
        <div class="panel-empty">Chargement…</div>
      </div>
    </div>
  </div>

  <!-- Tasks panel -->
  <div id="tasks-overlay" class="overlay hidden">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title"><svg class="lucide lucide-list-checks lucide-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>Tâches en cours</span>
        <button class="close-btn" aria-label="Fermer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="panel-list" id="tasks-list">
        <div class="panel-empty">Chargement…</div>
      </div>
    </div>
  </div>

  <!-- Weather panel -->
  <div id="weather-overlay" class="overlay hidden">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title" id="weather-title"><svg class="lucide lucide-cloud-sun lucide-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="M20 12h2"/><path d="m19.07 4.93-1.41 1.41"/><path d="M15.947 12.65a4 4 0 0 0-5.925-4.128"/><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/></svg>Météo</span>
        <button class="close-btn" aria-label="Fermer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="panel-list" id="weather-list">
        <div class="panel-empty">Chargement…</div>
      </div>
    </div>
  </div>

  <!-- Events panel -->
  <div id="events-overlay" class="overlay hidden">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title"><svg class="lucide lucide-calendar lucide-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>Évènements à venir</span>
        <button class="close-btn" aria-label="Fermer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="panel-list" id="events-list">
        <div class="panel-empty">Chargement…</div>
      </div>
    </div>
  </div>

  <!-- Dépôt express panel (décharge cognitive directe, sans LLM) -->
  <div id="depot-overlay" class="overlay hidden">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title"><svg class="lucide lucide-pen-line lucide-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></svg>Dépôt express</span>
        <button class="close-btn" aria-label="Fermer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="panel-list">
        <div class="depot-form">
          <textarea id="depot-input" class="depot-input" rows="4" placeholder="Vide-toi la tête… je garde, tu n'as plus à y penser."></textarea>
          <div class="depot-chips" role="group" aria-label="Type (optionnel)">
            <button type="button" class="depot-chip" data-kind="worry">Souci</button>
            <button type="button" class="depot-chip" data-kind="idea">Idée</button>
            <button type="button" class="depot-chip" data-kind="note">Note</button>
          </div>
          <button type="button" id="depot-submit" class="depot-submit">Déposer</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Pour toi panel (restitution des dépôts) -->
  <div id="foryou-overlay" class="overlay hidden">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title"><svg class="lucide lucide-inbox lucide-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>Pour toi</span>
        <button class="close-btn" aria-label="Fermer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="panel-list" id="foryou-list">
        <div class="panel-empty">Chargement…</div>
      </div>
    </div>
  </div>

  <!-- Budget panel (formulaire de saisie + récap interactif) -->
  <div id="budget-overlay" class="overlay hidden">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title"><svg class="lucide lucide-wallet lucide-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>Budget</span>
        <button class="close-btn" aria-label="Fermer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="panel-list" id="budget-list">
        <div class="panel-empty">Chargement…</div>
      </div>
    </div>
  </div>

  <!-- Markdown full-screen view (réutilisé pour la card Actu) -->
  <div id="markdown-view" class="hidden">
    <header>
      <button class="header-btn" title="Retour">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <div class="greeting" style="margin-left:8px">
        <div class="greeting-name" id="markdown-title">—</div>
        <div class="greeting-date" id="markdown-subtitle">—</div>
      </div>
      <button class="header-action-btn hidden" id="markdown-action-btn" type="button"></button>
    </header>
    <div class="markdown-body" id="markdown-body"></div>
  </div>

  <!-- Chat overlay (mode conversation) -->
  <div id="chat-view" class="hidden">
    <header>
      <button class="header-btn" title="Retour">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <div class="greeting" style="margin-left:8px">
        <div class="greeting-name">Conversation</div>
        <div class="greeting-date">Mode dialogue</div>
      </div>
    </header>
    <div class="chat-feed" id="chat-feed"></div>

    <!-- Composer du chat (preview + input) fixée au bas, z-index plus élevé
         que la composer du dashboard pour la couvrir quand chat-view est visible. -->
    <div class="composer-wrap chat">
      <div id="chat-preview-bar" class="hidden">
        <div class="preview-wrap">
          <img class="preview-img" id="chat-preview-img" src="" alt="" />
          <button class="remove-btn" aria-label="Retirer la photo">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <span class="preview-label">Photo jointe</span>
      </div>

      <div class="bar" id="chat-bar">
        <input type="file" id="chat-file-input" accept="image/*" style="display:none" />
        <button class="icon-btn" title="Joindre une photo">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <button class="icon-btn" id="chat-mic-btn" title="Dicter">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
            <path d="M19 10v2a7 7 0 01-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <textarea class="msg-input" id="chat-input" placeholder="Écris…" rows="1"></textarea>
        <button class="send-btn" id="chat-send-btn" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

</div>

<!-- Lame de verre échantillonnée par iOS 26 pour peindre la bande système
     sous le web view (cf. #edge-glass dans layout.css). -->
<div id="edge-glass" aria-hidden="true"></div>

<script type="module" src="/static/js/main.js?v=16"></script>
</body>
</html>
