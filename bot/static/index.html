<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Copain" />
  <title>Copain</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="apple-touch-icon" href="/static/icon-1024.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f11;
      --bg2: #13131a;
      --bg3: #1e1e2e;
      --border: #1e1e24;
      --border2: #2a2a3a;
      --text: #e8e8ec;
      --text2: #9999aa;
      --text3: #6b6b80;
      --accent: #5b5bd6;
      --green: #4ade80;
      --red: #ef4444;
      --purple: #a855f7;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; }

    #app { display: flex; flex-direction: column; height: 100dvh; max-width: 480px; margin: 0 auto; background: var(--bg); position: relative; overflow: hidden; }

    /* ── Header ── */
    header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top)); border-bottom: 1px solid var(--border); background: var(--bg2); flex-shrink: 0; }
    .avatar { font-size: 22px; background: var(--bg3); border-radius: 12px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .header-name { font-weight: 600; font-size: 15px; letter-spacing: -0.2px; }
    .header-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px #4ade8066; }
    .bell-btn { position: relative; width: 36px; height: 36px; border-radius: 50%; background: var(--bg3); border: 1px solid var(--border2); color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform 0.1s; }
    .bell-btn:active { transform: scale(0.92); }
    .badge { position: absolute; top: -3px; right: -3px; background: var(--red); color: #fff; font-size: 9px; font-weight: 700; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

    /* ── Feed ── */
    #feed { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
    #feed::-webkit-scrollbar { width: 3px; }
    #feed::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

    .row { display: flex; align-items: flex-end; gap: 8px; animation: fadeUp 0.2s ease; }
    .row.user { justify-content: flex-end; }
    .row.bot { justify-content: flex-start; }

    .avatar-sm { font-size: 14px; background: var(--bg3); border-radius: 9px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .bubble { max-width: 78%; padding: 9px 13px; border-radius: 18px; display: flex; flex-direction: column; gap: 5px; }
    .bubble.user { background: var(--accent); border-bottom-right-radius: 4px; }
    .bubble.bot { background: var(--bg3); border: 1px solid var(--border2); border-bottom-left-radius: 4px; cursor: pointer; }
    .bubble.error { background: #2a1a1a; border-color: var(--red); }
    .bubble-text { font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
    .bubble-img { width: 100%; max-width: 220px; border-radius: 10px; display: block; }
    .bubble-meta { display: flex; align-items: center; justify-content: flex-end; gap: 5px; }
    .copy-hint { color: var(--text3); display: flex; align-items: center; opacity: 0.6; }
    .ts { font-size: 10px; color: var(--text3); }

    .typing { flex-direction: row; align-items: center; gap: 5px; padding: 12px 14px; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    /* ── Raccourcis ── */
    #quick-row { display: flex; gap: 8px; padding: 8px 14px; overflow-x: auto; flex-shrink: 0; border-top: 1px solid #1a1a22; scrollbar-width: none; }
    #quick-row::-webkit-scrollbar { display: none; }
    .chip { flex-shrink: 0; padding: 6px 12px; border-radius: 20px; background: var(--bg3); border: 1px solid var(--border2); color: #c8c8d8; font-size: 12.5px; cursor: pointer; white-space: nowrap; font-family: inherit; transition: background 0.15s, transform 0.1s; }
    .chip:hover { background: #26263a; }
    .chip:active { transform: scale(0.94); }
    .chip:disabled { opacity: 0.4; cursor: default; }

    /* ── Preview photo ── */
    #preview-bar { padding: 8px 14px; border-top: 1px solid var(--border); background: var(--bg2); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .preview-wrap { position: relative; width: 48px; height: 48px; flex-shrink: 0; }
    .preview-img { width: 48px; height: 48px; object-fit: cover; border-radius: 9px; }
    .remove-btn { position: absolute; top: -5px; right: -5px; width: 16px; height: 16px; border-radius: 50%; background: var(--red); border: none; color: #fff; font-size: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .preview-label { font-size: 12px; color: var(--text2); }

    /* ── Barre saisie ── */
    #bar { display: flex; align-items: flex-end; gap: 7px; padding: 10px 14px; border-top: 1px solid var(--border); background: var(--bg2); flex-shrink: 0; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
    .icon-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--bg3); border: 1px solid var(--border2); color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform 0.1s; }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn.recording { background: #3b1f4a; border-color: var(--purple); color: var(--purple); }
    #msg-input { flex: 1; background: var(--bg3); border: 1px solid var(--border2); border-radius: 18px; padding: 9px 14px; color: var(--text); font-size: 14px; resize: none; line-height: 1.5; font-family: inherit; max-height: 110px; overflow-y: auto; outline: none; transition: border-color 0.15s; }
    #msg-input:focus { border-color: var(--accent); }
    #send-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity 0.15s, transform 0.1s; }
    #send-btn:active { transform: scale(0.92); }
    #send-btn:disabled { opacity: 0.4; cursor: default; }

    /* ── Panneau notifications ── */
    #notif-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); z-index: 10; display: flex; flex-direction: column; justify-content: flex-end; animation: fadeIn 0.15s ease; }
    #notif-panel { background: var(--bg2); border-top: 1px solid var(--border2); border-radius: 20px 20px 0 0; padding-bottom: 24px; animation: slideUp 0.25s ease; max-height: 65vh; display: flex; flex-direction: column; }
    .notif-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 14px; }
    .notif-title { font-weight: 600; font-size: 15px; }
    .close-btn { background: var(--bg3); border: 1px solid var(--border2); color: var(--text2); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; }
    #notif-list { overflow-y: auto; padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
    .notif-item { background: var(--bg3); border: 1px solid var(--border2); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
    .notif-text { font-size: 13.5px; line-height: 1.55; }
    .notif-time { font-size: 11px; color: var(--text3); align-self: flex-end; }
    .notif-empty { padding: 32px 20px; color: var(--text3); font-size: 13px; text-align: center; }

    /* ── Toast ── */
    #toast { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); background: #2a2a3a; border: 1px solid #3a3a4a; border-radius: 20px; padding: 8px 18px; font-size: 13px; color: var(--text); white-space: nowrap; z-index: 20; animation: toastIn 0.2s ease; pointer-events: none; }

    /* ── Animations ── */
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    @keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(8px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="avatar">🤝</div>
    <div style="flex:1">
      <div class="header-name">Copain</div>
      <div class="header-sub">Assistant personnel · Pi 5</div>
    </div>
    <div class="status-dot"></div>
    <button class="bell-btn" id="bell-btn" onclick="openNotifs()">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </button>
  </header>

  <div id="feed"></div>

  <div id="quick-row"></div>

  <div id="preview-bar" style="display:none">
    <div class="preview-wrap">
      <img class="preview-img" id="preview-img" src="" alt="preview" />
      <button class="remove-btn" onclick="removeAttachment()">✕</button>
    </div>
    <span class="preview-label">Photo jointe</span>
  </div>

  <div id="bar">
    <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFileChange(event)" />
    <button class="icon-btn" onclick="document.getElementById('file-input').click()" title="Joindre une photo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
      </svg>
    </button>
    <button class="icon-btn" id="mic-btn" onclick="toggleMic()" title="Dicter">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
        <path d="M19 10v2a7 7 0 01-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <textarea id="msg-input" placeholder="Écris un message…" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="send-btn" onclick="send()" disabled>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<script>
  // ── Config ─────────────────────────────────────────────────────────────
  let API_KEY = "";
  fetch("/config").then(r => r.json()).then(d => { API_KEY = d.api_key; });
  const API_BASE  = "";                  // vide = même origin (FastAPI sert ce fichier)

  const QUICK_ACTIONS = [
    { label: "☀️ Briefing",   msg: "Donne-moi mon briefing du jour" },
    { label: "✅ Tâches",     msg: "Quelles sont mes tâches en cours ?" },
    { label: "📅 Agenda",     msg: "Quels sont mes prochains événements ?" },
    { label: "🌤 Météo",      msg: "Quelle est la météo aujourd'hui à Sélestat ?" },
    { label: "⛽ Carburant",  msg: "Où est le gazole le moins cher près de chez moi ?" },
    { label: "📰 Actu",       msg: "Résume les dernières actus de mes flux RSS" },
  ];

  // ── État ────────────────────────────────────────────────────────────────
  let loading      = false;
  let attachment   = null;   // { b64, mediaType, preview }
  let recognition  = null;
  let toastTimer   = null;
  let unreadCount  = 0;

  // ── Init ────────────────────────────────────────────────────────────────
  document.addEventListener("DOMContentLoaded", () => {
    renderQuickActions();
    appendMessage("assistant", "Bonjour ! Comment puis-je t'aider aujourd'hui ?");
    document.getElementById("msg-input").addEventListener("input", updateSendBtn);
  });

  function renderQuickActions() {
    const row = document.getElementById("quick-row");
    QUICK_ACTIONS.forEach(a => {
      const btn = document.createElement("button");
      btn.className = "chip";
      btn.textContent = a.label;
      btn.onclick = () => send(a.msg);
      row.appendChild(btn);
    });
  }

  // ── Messages ────────────────────────────────────────────────────────────
  function appendMessage(role, text, imgSrc, isError) {
    const feed = document.getElementById("feed");
    const ts   = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });

    const row  = document.createElement("div");
    row.className = `row ${role}`;

    if (role === "assistant") {
      const av = document.createElement("div");
      av.className = "avatar-sm";
      av.textContent = "🤝";
      row.appendChild(av);
    }

    const bubble = document.createElement("div");
    bubble.className = `bubble ${role}${isError ? " error" : ""}`;

    if (imgSrc) {
      const img = document.createElement("img");
      img.src = imgSrc; img.className = "bubble-img"; img.alt = "photo";
      bubble.appendChild(img);
    }
    if (text) {
      const t = document.createElement("span");
      t.className = "bubble-text"; t.textContent = text;
      bubble.appendChild(t);
    }

    const meta = document.createElement("div");
    meta.className = "bubble-meta";
    if (role === "assistant") {
      meta.innerHTML = `<span class="copy-hint"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></span>`;
      bubble.style.cursor = "pointer";
      bubble.onclick = () => { navigator.clipboard?.writeText(text); showToast("Copié !"); };
    }
    const tsEl = document.createElement("span");
    tsEl.className = "ts"; tsEl.textContent = ts;
    meta.appendChild(tsEl);
    bubble.appendChild(meta);
    row.appendChild(bubble);
    feed.appendChild(row);
    feed.scrollTop = feed.scrollHeight;
  }

  function showTyping() {
    const feed = document.getElementById("feed");
    const row = document.createElement("div");
    row.className = "row bot"; row.id = "typing-row";
    const av = document.createElement("div"); av.className = "avatar-sm"; av.textContent = "🤝";
    const b  = document.createElement("div"); b.className = "bubble bot typing";
    b.innerHTML = `<span class="dot"></span><span class="dot"></span><span class="dot"></span>`;
    row.appendChild(av); row.appendChild(b); feed.appendChild(row);
    feed.scrollTop = feed.scrollHeight;
  }

  function hideTyping() {
    document.getElementById("typing-row")?.remove();
  }

  // ── Envoi ───────────────────────────────────────────────────────────────
  async function send(overrideText) {
    const text = (overrideText ?? document.getElementById("msg-input").value).trim();
    if ((!text && !attachment) || loading) return;

    setLoading(true);
    appendMessage("user", text || null, attachment?.preview ?? null);
    document.getElementById("msg-input").value = "";
    autoResize(document.getElementById("msg-input"));
    updateSendBtn();

    const att = attachment;
    removeAttachment();
    showTyping();

    try {
      const reply = att
        ? await callImage(text, att)
        : await callText(text);
      hideTyping();
      appendMessage("assistant", reply);
    } catch (e) {
      hideTyping();
      appendMessage("assistant", "⚠️ Impossible de joindre Copain. Vérifie que le Pi est accessible via Tailscale.", null, true);
    } finally {
      setLoading(false);
    }
  }

  async function callText(message) {
    const res = await fetch(`${API_BASE}/ask`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": API_KEY },
      body: JSON.stringify({ message })
    });
    if (!res.ok) throw new Error(`${res.status}`);
    return (await res.json()).response;
  }

  async function callImage(message, att) {
    const res = await fetch(`${API_BASE}/ask/image`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": API_KEY },
      body: JSON.stringify({ message: message || "", image_b64: att.b64, media_type: att.mediaType })
    });
    if (!res.ok) throw new Error(`${res.status}`);
    return (await res.json()).response;
  }

  // ── Photo ───────────────────────────────────────────────────────────────
  function handleFileChange(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      attachment = { b64: result.split(",")[1], mediaType: file.type, preview: result };
      document.getElementById("preview-img").src = result;
      document.getElementById("preview-bar").style.display = "flex";
      document.getElementById("msg-input").placeholder = "Ajoute un message…";
      updateSendBtn();
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  }

  function removeAttachment() {
    attachment = null;
    document.getElementById("preview-bar").style.display = "none";
    document.getElementById("preview-img").src = "";
    document.getElementById("msg-input").placeholder = "Écris un message…";
    updateSendBtn();
  }

  // ── Micro ───────────────────────────────────────────────────────────────
  function toggleMic() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { showToast("Micro non supporté ici (requis : HTTPS)"); return; }

    if (recognition) {
      recognition.stop(); recognition = null;
      document.getElementById("mic-btn").classList.remove("recording");
      return;
    }

    const r = new SR();
    r.lang = "fr-FR"; r.continuous = false; r.interimResults = false;
    recognition = r;

    document.getElementById("mic-btn").classList.add("recording");
    r.onresult = e => {
      const t = e.results[0][0].transcript;
      const input = document.getElementById("msg-input");
      input.value = input.value ? `${input.value} ${t}` : t;
      autoResize(input); updateSendBtn();
    };
    r.onerror = () => { showToast("Erreur micro"); };
    r.onend  = () => { recognition = null; document.getElementById("mic-btn").classList.remove("recording"); };
    r.start();
  }

  // ── Notifications ────────────────────────────────────────────────────────
  async function openNotifs() {
    const overlay = document.createElement("div");
    overlay.id = "notif-overlay";
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

    const panel = document.createElement("div");
    panel.id = "notif-panel";
    panel.innerHTML = `
      <div class="notif-header">
        <span class="notif-title">🔔 Notifications</span>
        <button class="close-btn" onclick="document.getElementById('notif-overlay').remove()">✕</button>
      </div>
      <div id="notif-list"><div class="notif-empty">Chargement…</div></div>
    `;
    overlay.appendChild(panel);
    document.getElementById("app").appendChild(overlay);

    try {
      const res = await fetch(`${API_BASE}/notifications`, {
        headers: { "X-API-Key": API_KEY }
      });
      const data = await res.json();
      const list = document.getElementById("notif-list");
      const items = data.notifications ?? [];

      if (items.length === 0) {
        list.innerHTML = `<div class="notif-empty">Aucune notification en attente</div>`;
      } else {
        list.innerHTML = items.map(n => `
          <div class="notif-item">
            <span class="notif-text">${escHtml(n.text)}</span>
            <span class="notif-time">${escHtml(n.created_at)}</span>
          </div>
        `).join("");
        // Reset badge
        unreadCount = 0;
        const badge = document.querySelector(".badge");
        if (badge) badge.remove();
      }
    } catch {
      document.getElementById("notif-list").innerHTML =
        `<div class="notif-empty">Impossible de charger les notifications</div>`;
    }
  }

  // ── Helpers ──────────────────────────────────────────────────────────────
  function showToast(msg) {
    document.getElementById("toast")?.remove();
    clearTimeout(toastTimer);
    const t = document.createElement("div");
    t.id = "toast"; t.textContent = msg;
    document.getElementById("app").appendChild(t);
    toastTimer = setTimeout(() => t.remove(), 2000);
  }

  function setLoading(val) {
    loading = val;
    document.getElementById("send-btn").disabled = val || !canSend();
    document.querySelectorAll(".chip").forEach(c => c.disabled = val);
  }

  function canSend() {
    return (document.getElementById("msg-input").value.trim() || !!attachment) && !loading;
  }

  function updateSendBtn() {
    document.getElementById("send-btn").disabled = !canSend();
  }

  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  }

  function autoResize(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 110) + "px";
  }

  function escHtml(str) {
    return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
</script>
</body>
</html>
