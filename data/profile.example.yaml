# Profil utilisateur — édité à la main, injecté à chaque appel LLM.
#
# Le fichier est lu une fois au démarrage du bot. Pour appliquer un changement,
# il faut redémarrer le container (ou relancer `make run`).
#
# Structure libre : ajoute / enlève les sections que tu veux. Le LLM lit
# tout le YAML tel quel comme contexte de base. Seules contraintes :
# - le top niveau doit être un dict (pas une liste),
# - le fichier doit parser en YAML valide.
#
# Pour activer : copie ce fichier en `data/profile.yaml` et édite-le.
#
# ⚠️ Piège YAML : n'écris JAMAIS une liste vide `[]` puis des items `-` en
# dessous (mélange flow-style + block-style invalide). Pour ajouter des
# items à une section, supprime simplement le `[]` (ou laisse les exemples
# commentés ci-dessous comme modèle).

identity:
  name: Arnaud
  city: Sélestat
  language: fr

# Personnes proches souvent mentionnées. Décommente et adapte.
family:
  # - { name: Anne, relation: épouse, birthday: 1990-01-01 }
  # - { name: Léo, relation: fils, birthday: 2018-06-12 }

work:
  role: Développeur Python
  hours: 8h30-17h30 en semaine
  location: Obernai

# Décommente et adapte.
vehicles:
  # - { brand: Renault, model: Clio, fuel_type: sp95 }

# Habitudes que l'assistant peut anticiper (texte libre, une routine par ligne).
routines:
  # - Cyclisme sur route le mercredi
  # - Course à pied le samedi matin

preferences:
  tone: tutoiement
  response_length: court    # court | normal | détaillé
  emoji: rare               # rare | normal | sans
