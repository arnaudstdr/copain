[project]
name = "copain"
version = "0.1.0"
description = "Assistant personnel HTTP self-hosted (FastAPI + Ollama + ChromaDB + SearXNG)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "aiofiles>=23.0",
    "ollama>=0.3,<1",
    "chromadb>=1.5,<2",
    "sqlalchemy[asyncio]>=2,<3",
    "aiosqlite>=0.20",
    "apscheduler>=3.10,<4",
    "caldav>=3.2,<4",
    "dateparser>=1.2",
    "feedparser>=6",
    "vobject>=0.9",
    "httpx>=0.27,<1",
    "python-dotenv>=1",
    "pyyaml>=6",
    "structlog>=24",
    "sentry-sdk>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-dateparser",
    "types-pyyaml",
]

[tool.uv]
# Projet non-packagé : `uv sync` installe uniquement les dépendances, il ne
# construit pas `bot/` comme distribution. Le lock (uv.lock) est la source de
# vérité des versions (dépendances directes ET transitives).
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ASYNC",
    "SIM", # flake8-simplify
    "RUF",
]
ignore = ["E501"]  # handled by formatter

[tool.ruff.lint.per-file-ignores]
# `Depends(...)` en default value est la convention FastAPI standard.
"bot/api.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "apscheduler.*",
    "ollama.*",
    "feedparser.*",
    "caldav.*",
    "vobject.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
